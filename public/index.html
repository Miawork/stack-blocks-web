<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>叠积木</title>
<meta name="description" content="看准时机，点一下屏幕，把积木一层层叠高。三关每天换新，还有 999 层地狱模式。">
<meta name="theme-color" content="#151833">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="叠积木">
<meta property="og:description" content="看准时机，点一下屏幕，把积木一层层叠高。三关每天换新，还有 999 层地狱模式。">
<meta property="og:image" content="images/share.jpg">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #151833;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
canvas {
  display: block;
  touch-action: none;
}
/* 电脑、平板上：画布是屏幕中间的一块，加上圆角和阴影 */
.framed canvas {
  border-radius: 18px;
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
}
#toast {
  position: fixed;
  left: 50%;
  bottom: 18%;
  transform: translateX(-50%);
  max-width: 80vw;
  padding: 10px 18px;
  border-radius: 999px;
  background: rgba(20, 20, 40, 0.88);
  color: #fff;
  font-size: 15px;
  line-height: 1.4;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
#toast.show { opacity: 1; }
noscript { color: #fff; padding: 24px; text-align: center; }
</style>
</head>
<body>
<canvas id="stage" aria-label="叠积木游戏画面"></canvas>
<div id="toast" role="status"></div>
<noscript>这个游戏需要开启 JavaScript 才能运行。</noscript>
<script src="game.js?v=900d7d4c89"></script>
</body>
</html>
